cff_ponctualite:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "../data/warehouse.duckdb"
      # Un seul fil : plusieurs modèles écrivant en parallèle dans le même fichier
      # DuckDB provoquaient des plantages aléatoires (code 139) sur les runners GitHub.
      threads: 1
      settings:
        memory_limit: "4GB"
        preserve_insertion_order: false
