name: Tests

on:
  push:
    paths-ignore: ["site/data/**"]
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Données fictives au format Ist-Daten
        run: python pipeline/make_sample.py
      - name: dbt build (modèles + tests)
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: Export
        run: python pipeline/export.py
