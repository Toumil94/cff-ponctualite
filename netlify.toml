[build]
  publish = "site"
  command = ""
  # Les données sont mises à jour chaque matin par GitHub Actions et lues directement
  # depuis GitHub par le dashboard : on ne redéploie que si le code du site change.
  # Cela évite un déploiement par jour et préserve le quota gratuit de Netlify.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/index.html netlify.toml"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
